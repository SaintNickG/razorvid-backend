name: backend-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r multicam_pipeline/requirements.txt -r multicam_pipeline/requirements-dev.txt

      - name: Run tests
        run: |
          cd multicam_pipeline
          python -m pytest -q tests/test_projects_persistence.py tests/test_pipeline_integration.py
